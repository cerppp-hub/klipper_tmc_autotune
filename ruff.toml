line-length = 88
target-version = "py39"

# CI-only tooling always runs under the Python 3.11 pinned in
# .github/workflows/lint.yml and uses `match` statements (3.10+); the plugin
# itself (autotune_tmc.py, motor_constants.py) targets the py39 floor above.
[per-file-target-version]
".github/scripts/*.py" = "py311"

[lint]
# Explicit rule selection, replacing ruff's no-config fallback (which varies
# across ruff versions and currently enables ~415 rules). Modeled after
# foci-rs/foci/tools/pyproject.toml.
select = [
    "F",           # pyflakes
    "E4", "E7", "E9", "E501",  # pycodestyle: import/statement/syntax errors, line length
    "I",           # isort
    "UP",          # pyupgrade
    "B",           # flake8-bugbear
    "C4",          # flake8-comprehensions
    "SIM",         # flake8-simplify
    "RUF",         # Ruff-specific rules
]
